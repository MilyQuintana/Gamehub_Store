<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub Store - Catálogo</title>
    <link rel="stylesheet" href="/Styles/styles.css">
</head>
<body>
    <header class="cabecera">
        <div class="cabecera__contenedor contenedor">
            <a href="index.html" class="cabecera__logo">Game<span>Hub</span> Store</a>
            <nav class="nav-principal" aria-label="Navegación principal">
                <ul class="nav-principal__lista">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html" aria-current="page">Catálogo</a></li>
                    <li><a href="carrito.html">Carrito</a></li>
                    <li><a href="checkout.html">Checkout</a></li>
                    <li><a href="ordenes.html">Mis órdenes</a></li>
                </ul>
            </nav>
            <a href="carrito.html" class="carrito-boton" aria-label="Ver carrito de compras">
                🛒 <span id="carrito-contador" class="carrito-boton__contador">0</span>
            </a>
        </div>
    </header>
    <main id="contenido-principal">
        <section class="seccion" aria-labelledby="catalogo-titulo">
            <div class="contenedor catalogo">
                <aside class="catalogo__filtros" aria-labelledby="filtros-titulo">
                    <h2 id="filtros-titulo">Filtros</h2>
                    <form id="form-filtros" class="formulario" novalidate>
                        <div class="campo">
                            <label for="filtro-categoria">Categoría</label>
                            <select id="filtro-categoria" name="categoria">
                                <option value="">Todas</option>
                                <option value="notebooks">Notebooks</option>
                                <option value="tarjetas-graficas">Tarjetas gráficas</option>
                                <option value="procesadores">Procesadores</option>
                                <option value="perifericos">Periféricos</option>
                                <option value="monitores">Monitores</option>
                                <option value="placas-madre">Placas madre</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label for="filtro-marca">Marca</label>
                            <select id="filtro-marca" name="marca">
                                <option value="">Todas</option>
                                <option value="asus">ASUS</option>
                                <option value="msi">MSI</option>
                                <option value="logitech">Logitech</option>
                                <option value="hiperx">Hyperx</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label for="filtro-precio">Precio minimo</label>
                            <input type="number" id="filtro-precio-min" name="precio" min="0" step="1000" 
                            placeholder="$0" inputmode="numeric">
                            <label for="filtro-precio-max">Precio máximo</label>
                            <input type="number" id="filtro-precio-max" name="precioMax" min="0" step="1000" 
                            placeholder="2000000" inputmode="numeric">

                            <span id="filtro-precio-error" class="error" role="alert"></span>
                        </div>
                        <button type="submit" class="boton boton-primario">Aplicar filtros</button>
                        <button type="reset" class="boton boton-secundario">Limpiar filtros</button>
                    </form>
                </aside>
                <div class="catalodo__resultados">
                    <div class="catalogo__cabecera-resultados">
                        <h1 id="catalogo-titulo">Catálogo</h1>
                        <p id="catalogo-contador-resultados" aria-live="polite"></p>
                    </div>
                    <div id="lista-productos" class="tarjetas-grilla">

                    </div>
                    <nav class="paginacion" aria-label="Paginación de resultados">
                        <button id="btn-cargar-mas" class="boton boton-secundario" 
                        type="button">Cargar más productos</button>
                    </nav>
                </div>
            </div>
        </section>
    </main>

    <footer class="pie-pagina">
        <div class="contenedor pie-de-pagina__contenido">
          <div>
            <p class="pie-de-pagina-marca">Game<span>Hub</span> Store</p>
            <p>Tienda gamer en línea. Mejor lugar para comprar todo tipo de productos.</p>
          </div>
          <nav aria-label="Enlaces del pie de página">
            <ul class="pie-de-pagina__lista">
              <li><a href="index.html">Inicio</a></li>
              <li><a href="catalogo.html">Catálogo</a></li>
              <li><a href="carrito.html">Carrito</a></li>
              <li><a href="checkout.html">Checkout</a></li>
            </ul>
          </nav>
          <p class="pie-de-pagina__copy">© 2026 GameHub Store. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script src="js/Data.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="js/validaciones.js"></script>
</body>
</html>
